name: ProofReel
description: Record verified MP4 video proofs of a pull request's features and post a Video proof comment.
author: ProofReel
branding:
  icon: video
  color: purple
inputs:
  spec:
    description: Spec slug(s) to record. Empty records every spec. Comma-separated slugs record that list. `auto` picks specs from the PR diff (see paths on each spec).
    required: false
    default: ""
  service-url:
    description: ProofReel hosted service. Set to "" to stay local (workflow artifact + comment from the workflow token).
    required: false
    default: https://api.proofreel.dev
  oidc-audience:
    description: Audience for the GitHub Actions OIDC token. Defaults to service-url.
    required: false
    default: ""
  attach-mode:
    description: How to publish media when the service does not comment - auto, gh-attach, gif-fallback, or none.
    required: false
    default: auto
  ai:
    description: Deprecated and ignored. Kept so existing workflows that set it keep working.
    required: false
    default: "false"
  github-token:
    description: Token used only for the fallback comment when the service does not post one.
    required: false
    default: ${{ github.token }}
  pr:
    description: Pull request number override.
    required: false
    default: ""
  telemetry:
    description: 'Send a small scrubbed error report (stage, error class, truncated message, repo, run id, Action version, runner OS) to the ProofReel service when the Action hits an internal error, a setup problem or a failed upload. Uses the workflow''s OIDC token (`id-token: write`); no secrets, env, tokens, URL query strings or file contents. Set to "false" to opt out.'
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install ProofReel runtime
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --omit=dev --no-audit --no-fund --loglevel=error
        echo "PROOFREEL_PW_VERSION=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_ENV"
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: proofreel-playwright-${{ runner.os }}-${{ env.PROOFREEL_PW_VERSION }}
    - name: Install browser and media tools
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PR: ${{ inputs.pr }}
      run: bash "${{ github.action_path }}/scripts/action-install-deps.sh"
    - name: Record, verify, publish
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_SPEC: ${{ inputs.spec }}
        INPUT_SERVICE_URL: ${{ inputs.service-url }}
        INPUT_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        INPUT_ATTACH_MODE: ${{ inputs.attach-mode }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PR: ${{ inputs.pr }}
        INPUT_TELEMETRY: ${{ inputs.telemetry }}
        PROOFREEL_SERVICE_URL: ${{ inputs.service-url }}
      run: node "${{ github.action_path }}/dist/action.js"
    - name: Upload MP4 artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proofreel-videos
        path: docs/videos/**
        if-no-files-found: ignore
